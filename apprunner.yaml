version: 1.0

# AWS App Runner — source code (no Docker needed). App Runner uses its
# managed Python 3.11 runtime; this file tells it how to build + run.
#
# Source repo: SyedaSarah18/agency-2026-funding-loops
# Branch:      v4.0-clean
# Source dir:  /  (this file is at repo root)
#
# Required env vars (set in App Runner console, NOT here — secrets):
#   PG_DSN
#   AWS_REGION
#   LLM_MODEL  (defaults to us.anthropic.claude-sonnet-4-6)
#
# App Runner provides AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY automatically
# via its instance role — do NOT pass them as env vars.

runtime: python311

build:
  commands:
    pre-build:
      - python --version
    build:
      # Install agent backend deps (FastAPI, Strands, polars, connectorx, etc.)
      - pip install --upgrade pip
      - pip install -r agent/requirements.txt

run:
  # Working dir = repo root; PYTHONPATH points at our src/ layout.
  runtime-version: 3.11
  command: |
    PYTHONPATH=agent/src uvicorn agent.api:app --host 0.0.0.0 --port 8080 --log-level info
  network:
    port: 8080
    env: PORT
  env:
    - name: PYTHONUNBUFFERED
      value: "1"
