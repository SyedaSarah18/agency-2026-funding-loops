[project]
name = "agency-26-agent-service"
version = "0.1.0"
description = "4-agent pipeline for Agency 2026 hackathon (Discovery > Investigation > Validator > Narrative)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "anthropic>=0.39",
    "boto3>=1.35",
    "networkx>=3.4",
    "strands-agents>=0.1",
    "pydantic>=2.9",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "tools*", "llm*"]
