[project]
name = "vendor-concentration-agent"
version = "0.1.0"
description = "Vendor Concentration agent — Agency 2026 hackathon"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "duckdb>=1.0",
    "boto3>=1.40",
    "strands-agents>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "httpx-sse>=0.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vendor_concentration_agent = ["prompts/*.md"]
